include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = Symbols Nerd Font Mono:size=12;3
font-2 = Symbols Nerd Font Mono:size=11;3
font-3 = Noto Color Emoji:scale=10;2
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.dim}
modules-left = launcher wallpaper i3 music
modules-center = cpu gpu memory
modules-right = xkeyboard pulseaudio backlight bluetooth tray date notifications
wm-restack = i3
enable-ipc = true
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
wrapping-scroll = false
format = <label-state> <label-mode>
label-mode-foreground = ${colors.urgent}
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.bg}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1

[module/date]
type = internal/date
locale = en_US.UTF-8
interval = 5
date = %d.%m.%y
time = %I:%M %p
label = %date%  %time%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.accent}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = %{A4:~/.config/i3/scripts/media.sh scroll-up:}%{A5:~/.config/i3/scripts/media.sh scroll-down:}%{A1:~/.config/i3/scripts/volume-popup.sh:}<ramp-volume> <label-volume>%{A}%{A}%{A}
format-muted = %{A4:~/.config/i3/scripts/media.sh scroll-up:}%{A5:~/.config/i3/scripts/media.sh scroll-down:}%{A1:~/.config/i3/scripts/volume-popup.sh:}<label-muted>%{A}%{A}%{A}
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
label-muted = 󰝟
label-muted-foreground = ${colors.dim}
click-right = ~/.config/i3/scripts/media.sh mute

[module/battery]
type = internal/battery
battery = ${env:BAT:BAT0}
adapter = ${env:ADP:AC}
full-at = 99
poll-interval = 5
format-charging = <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = 󰂄 %percentage%%
label-discharging = %percentage%%
label-full = 󰁹
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰂂
ramp-capacity-6 = 󰁹

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT:intel_backlight}
use-actual-brightness = true
enable-scroll = false
format = %{A4:~/.config/i3/scripts/media.sh bri-scroll-up:}%{A5:~/.config/i3/scripts/media.sh bri-scroll-down:}%{A1:~/.config/i3/scripts/power-popup.sh:}<ramp> <label>%{A}%{A}%{A}
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

[module/tray]
type = internal/tray
tray-spacing = 6px

[module/launcher]
type = custom/text
format = 󰐥
format-foreground = ${colors.accent}
format-padding = 1
click-left = ~/.config/i3/scripts/power-menu.sh

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
label = %output%
click-left = playerctl previous
click-middle = playerctl play-pause
click-right = playerctl next

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = 󰻠 %percentage%%

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 3
format = <label>
label = 󰢮 %output%

[module/memory]
type = custom/script
exec = ~/.config/polybar/scripts/ram.sh
interval = 3
format = <label>
label = 󰍛 %output%

[module/notifications]
type = custom/script
exec = ~/.config/polybar/scripts/notif.sh
interval = 1
click-left = ~/.config/i3/scripts/notif-popup.sh

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
click-left = ~/.config/i3/scripts/bt-popup.sh

[module/wallpaper]
type = custom/text
format = 󰋩
format-foreground = ${colors.accent}
format-padding = 0
click-left = ~/.config/i3/scripts/wallpicker.sh
