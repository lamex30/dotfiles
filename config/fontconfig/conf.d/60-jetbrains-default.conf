<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- JetBrainsMono Nerd Font as the default for everything; emoji fall back to Noto Color Emoji -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
